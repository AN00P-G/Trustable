<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #050505;
      --bg-2: #141416;
      --card: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f4f4f5;
      --text-dim: #9ca3af;
      --accent: #6b7280;
      --accent-2: #d4d4d8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.7); }
    }
    @keyframes shimmer {
      0% { background-position: -200px 0; }
      100% { background-position: 200px 0; }
    }
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85); }
      60% { transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }

    html, body { margin: 0; }

    body {
      width: 320px;
      position: relative;
      z-index: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg), var(--bg-2));
      overflow: hidden;
    }

    /* animated network background (sits behind all content) */
    .net-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -100;
      pointer-events: none;
      opacity: 0.85;
    }
    .header, .content { position: relative; z-index: 1; }

    .header {
      position: relative;
      padding: 18px 16px 14px;
      text-align: center;
      background: linear-gradient(120deg, #0a0a0a, #26262a, #0a0a0a);
      background-size: 200% 200%;
      animation: gradientShift 8s ease infinite;
      overflow: hidden;
    }
    .header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.25), transparent 60%);
      pointer-events: none;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: block;
      margin: 0 auto 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      animation: floatLogo 4s ease-in-out infinite;
    }
    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .subtitle {
      margin: 2px 0 0;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.85);
    }

    .content { padding: 14px 16px 16px; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 12px;
      min-height: 18px;
    }
    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 auto;
    }
    .status.loading .dot { animation: pulseDot 1s ease-in-out infinite; }
    .status.done .dot { background: var(--good); animation: none; }
    .status.error .dot { background: var(--bad); animation: none; }
    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .status.loading .spinner { display: inline-block; }

    .card { animation: fadeSlideUp 0.4s ease both; }

    /* Circular score ring */
    .score-ring {
      position: relative;
      width: 168px;
      height: 168px;
      margin: 6px auto 14px;
      animation: popIn 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28) both;
    }
    .score-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .ring-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 10;
    }
    .ring-progress {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 339.292;
      stroke-dashoffset: 339.292;
      transition: stroke-dashoffset 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ring-progress.good { stroke: var(--good); color: var(--good); }
    .ring-progress.bad { stroke: var(--bad); color: var(--bad); }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .ring-score {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .ring-score.good { color: var(--good); }
    .ring-score.bad { color: var(--bad); }
    .ring-verdict {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      animation: popIn 0.5s 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) both;
    }
    .ring-verdict.good { color: var(--good); }
    .ring-verdict.bad { color: var(--bad); }
    .ring-label {
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 1px;
    }

    /* Features dropdown */
    .features { margin-top: 16px; }
    .features-toggle {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border: 1px solid var(--card-border); border-radius: 12px;
      background: var(--card); color: var(--text); cursor: pointer;
      font-size: 12px; font-weight: 600; letter-spacing: 0.3px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .features-toggle:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.22); }
    .features-toggle .caret { width: 14px; height: 14px; flex: 0 0 auto; transition: transform 0.25s ease; color: var(--text-dim); }
    .features.open .features-toggle .caret { transform: rotate(180deg); }
    .features.open .features-toggle { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom-color: transparent; }
    .features-panel {
      overflow: hidden; max-height: 0; opacity: 0;
      border: 1px solid transparent; border-top: none;
      transition: max-height 0.3s ease, opacity 0.25s ease, padding 0.25s ease;
      padding: 0 12px;
    }
    .features.open .features-panel {
      max-height: 460px; opacity: 1; padding: 12px;
      border-color: var(--card-border);
      border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;
      background: rgba(255,255,255,0.03);
    }
    .features-title {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    .feature {
      margin-bottom: 9px;
      animation: fadeSlideUp 0.4s ease both;
    }
    .feature-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
      font-size: 12px;
    }
    .feature-name {
      font-family: "Fira Code", "Consolas", monospace;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }
    .feature-tag {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.08);
    }
    .feature-track {
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .feature-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .feature-fill.pos { background: linear-gradient(90deg, #22c55e, #4ade80); }
    .feature-fill.neg { background: linear-gradient(90deg, #ef4444, #f87171); }

    /* Skeleton loader */
    .skeleton {
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.14) 37%, rgba(255,255,255,0.06) 63%);
      background-size: 400px 100%;
      animation: shimmer 1.4s ease infinite;
    }
    .sk-line { height: 12px; margin-bottom: 10px; }
    .sk-lg { height: 40px; margin-bottom: 14px; }

    .message {
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      padding: 8px 4px;
    }

    /* Inline re-scan icon (sits on the status line) */
    .rescan-icon {
      margin-left: auto; flex: 0 0 auto;
      width: 22px; height: 22px; padding: 0;
      border: none; border-radius: 7px;
      background: rgba(255,255,255,0.08); color: var(--accent-2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s ease, transform 0.15s ease, color 0.15s ease;
    }
    .rescan-icon:hover { background: rgba(255,255,255,0.18); color: #fff; transform: rotate(-25deg); }
    .rescan-icon:active { transform: scale(0.9); }
    .rescan-icon:disabled { opacity: 0.5; cursor: default; }
    .rescan-icon svg { width: 13px; height: 13px; }
    .rescan-icon.spinning svg { animation: spin 0.7s linear infinite; }
  </style>
</head>
<body>
  <canvas id="net-bg" class="net-bg"></canvas>

  <div class="header">
    <img src="icon.png" class="logo" alt="Trustable logo" />
    <h1 class="title">Trustable</h1>
    <p class="subtitle">Content trust analysis</p>
  </div>

  <div class="content">
    <div id="status" class="status loading">
      <span class="dot"></span>
      <span class="spinner"></span>
      <span id="status-text">Starting analysis…</span>
      <button id="rescan" class="rescan-icon" type="button" title="Re-scan page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <polyline points="21 3 21 9 15 9" />
        </svg>
      </button>
    </div>

    <div id="result"></div>
  </div>

  <script src="network.js"></script>
  <script src="popup.js"></script>
</body>
</html>
