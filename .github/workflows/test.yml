name: Multi-OS Python CI

on: 
    push:
        branches:
            - main


jobs:
  build:
    timeout-minutes: 5
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        # Define the operating systems
        os: [ubuntu-latest, windows-latest, macos-latest]


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run main.py with test input
        run: | 
          cd src
          uv run main.py <<EOF
            Get a free iPhone
            quit
            EOF

